frr defaults datacenter
hostname spine2
log stdout
service integrated-vtysh-config
!
interface eth1
 ip address 10.255.12.0/31
!
interface eth2
 ip address 10.255.22.0/31
!
router bgp 65000
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 neighbor 10.255.12.1 remote-as 65001
 neighbor 10.255.22.1 remote-as 65002
 !
 address-family ipv4 unicast
  maximum-paths 2
 exit-address-family
!
