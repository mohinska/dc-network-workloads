frr defaults datacenter
hostname leaf2
log stdout
service integrated-vtysh-config
!
interface eth1
 ip address 10.255.21.1/31
!
interface eth2
 ip address 10.255.22.1/31
!
interface eth3
 ip address 10.0.4.1/24
!
interface eth4
 ip address 10.0.5.1/24
!
interface eth5
 ip address 10.0.6.1/24
!
router bgp 65002
 bgp router-id 10.255.0.12
 no bgp ebgp-requires-policy
 neighbor 10.255.21.0 remote-as 65000
 neighbor 10.255.22.0 remote-as 65000
 !
 address-family ipv4 unicast
  network 10.0.4.0/24
  network 10.0.5.0/24
  network 10.0.6.0/24
  maximum-paths 2
 exit-address-family
!
