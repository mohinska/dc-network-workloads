frr defaults datacenter
hostname spine1
log stdout
service integrated-vtysh-config
!
interface eth1
 ip address 10.255.11.0/31
!
interface eth2
 ip address 10.255.21.0/31
!
router bgp 65000
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 10.255.11.1 remote-as 65001
 neighbor 10.255.21.1 remote-as 65002
 !
 address-family ipv4 unicast
  maximum-paths 2
 exit-address-family
!
