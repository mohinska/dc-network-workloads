frr defaults datacenter
hostname leaf1
log stdout
service integrated-vtysh-config
!
interface eth1
 ip address 10.255.11.1/31
!
interface eth2
 ip address 10.255.12.1/31
!
interface eth3
 ip address 10.0.1.1/24
!
interface eth4
 ip address 10.0.2.1/24
!
interface eth5
 ip address 10.0.3.1/24
!
router bgp 65001
 bgp router-id 10.255.0.11
 no bgp ebgp-requires-policy
 neighbor 10.255.11.0 remote-as 65000
 neighbor 10.255.12.0 remote-as 65000
 !
 address-family ipv4 unicast
  network 10.0.1.0/24
  network 10.0.2.0/24
  network 10.0.3.0/24
  maximum-paths 2
 exit-address-family
!
